name: docker multi-arch build

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ''
            extra: ''
          - suffix: '_newtx'
            extra: 'newtx'

    steps:
      - name: Validate tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != "tag" ]] ||
             [[ ! "$TAG" =~ ^[0-9][a-zA-Z0-9_.-]*$ ]] ||
             [[ ${#TAG} -gt 122 ]]; then
             echo "Select a valid numeric-prefixed git tag (max 122 characters)." >&2
             exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find latest year tag
        id: latest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          latest=$(git tag --list | grep -E '^[0-9]{4}$' | sort -n | tail -n 1)
          if [[ -n "$latest" && "$TAG" == "$latest" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - name: Setup docker buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TEXLIVE_EXTRA=${{ matrix.extra }}
          tags: |
            pman0214/alpine-texlive-ja-epspdf:${{ github.ref_name }}${{ matrix.suffix }}
            ${{ steps.latest.outputs.is_latest == 'true' && matrix.suffix == '' && 'pman0214/alpine-texlive-ja-epspdf:latest' || '' }}
